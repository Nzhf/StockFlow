name: StockFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend (Laravel API)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: stockflow_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, ctype, tokenizer, xml
          coverage: none

      - name: Install Dependencies
        run: |
          cd api
          composer install --no-progress --no-suggest --prefer-dist

      - name: Copy .env and Generate Key
        run: |
          cd api
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stockflow_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Run Migrations
        run: |
          cd api
          php artisan migrate --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stockflow_test
          DB_USERNAME: root
          DB_PASSWORD: ""

      - name: Run Pest / PHPUnit Tests
        run: |
          cd api
          php artisan test

      - name: Check Code Formatting (Pint)
        run: |
          cd api
          ./vendor/bin/pint --test

  frontend-build:
    name: Frontend (React SPA)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Lint Code
        run: |
          cd web
          npm run lint

      - name: Check Prettier Formatting
        run: |
          cd web
          npm run format:check

      - name: Build Frontend
        run: |
          cd web
          npm run build
